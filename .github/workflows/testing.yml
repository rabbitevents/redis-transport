name: Unit tests

on: [push, pull_request]

env:
  # rabbitevents/foundation and rabbitevents/listener ^10.0 are not on Packagist yet:
  # take them from this branch of rabbitevents/rabbitevents. Drop these steps once 10.0 is released.
  RABBITEVENTS_REF: '10.x'

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.4']
    name: Testing on PHP ${{ matrix.php-versions }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v6

      - name: Checkout RabbitEvents ${{ env.RABBITEVENTS_REF }}
        uses: actions/checkout@v6
        with:
          repository: rabbitevents/rabbitevents
          ref: ${{ env.RABBITEVENTS_REF }}
          path: .rabbitevents

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring,bcmath,redis,sockets
          coverage: pcov
          tools: phpunit,composer

      - name: Use RabbitEvents ${{ env.RABBITEVENTS_REF }}
        run: |
          composer config repositories.rabbitevents-foundation '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Foundation", "options": {"versions": {"rabbitevents/foundation": "10.0.x-dev"}}}'
          composer config repositories.rabbitevents-listener '{"type": "path", "url": ".rabbitevents/src/RabbitEvents/Listener", "options": {"versions": {"rabbitevents/listener": "10.0.x-dev"}}}'
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install dependencies
        run: composer update -o -q --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Generate coverage report
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(php -r "
            \$xml = simplexml_load_file('build/logs/clover.xml');
            \$metrics = \$xml->project->metrics;
            \$elements = (float) \$metrics['elements'];
            \$coveredelements = (float) \$metrics['coveredelements'];
            echo round((\$coveredelements / \$elements) * 100, 2);
          ")
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: a86abd383c70df420b1fa23d130bc3b7
          filename: redis-transport-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.percentage >= 80 && 'brightgreen' || steps.coverage.outputs.percentage >= 60 && 'yellow' || 'red' }}
